[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

upload_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5C93201077-if00
monitor_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5C93201077-if00

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=0

    ; ---- TFT_eSPI ----
    ; USE_HSPI_PORT la BAT BUOC tren ESP32-S3: no quyet dinh dia chi thanh ghi SPI
    ; ma thu vien ghi thang vao. Bo ra -> tro vao dia chi cua ESP32 doi cu -> panic.
    ; Doi lai HSPI khong co chan mac dinh tren S3, nen phai tu gan chan trong
    ; setup() bang tft.getSPIinstance().begin(...) TRUOC khi goi tft.init().
    -D USER_SETUP_LOADED
    -D USE_HSPI_PORT
    -D ST7789_DRIVER
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=13
    -D TFT_RST=14
    -D TFT_MISO=-1
    -D SPI_FREQUENCY=20000000
    -D LOAD_GLCD
    -D LOAD_FONT2
    -D LOAD_FONT4
    -D SMOOTH_FONT

    ; Neu mau bi am ban -> bo comment:
    ; -D TFT_INVERSION_ON
    ; Neu do va xanh duong doi cho -> bo comment:
    ; -D TFT_RGB_ORDER=TFT_BGR

monitor_filters = esp32_exception_decoder, time

; BLE + TFT day len gan 1.4MB, phan vung mac dinh chi cho ~1.2MB
board_build.partitions = huge_app.csv

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    adafruit/Adafruit SHT31 Library@^2.2.2
    ; ghim 1.4.x: NimBLE 2.x doi API callback, code duoi viet cho 1.4.x
    h2zero/NimBLE-Arduino@^1.4.2